<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awesome Coding Fonts</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2750%27%3E%E2%8C%A8%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0a0f1c;color:#e5edfc}*{box-sizing:border-box}body{margin:0}header{padding:40px max(24px,calc((100vw - 1400px)/2));background:linear-gradient(120deg,#1b3457,#0a0f1c);border-bottom:1px solid #29354a}h1{font-size:clamp(32px,5vw,58px);margin:0}p{color:#aabbd5}a{color:#90c1ff}main{max-width:1450px;margin:auto;padding:24px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}select,input,button,textarea{background:#18263c;color:#fff;border:1px solid #40536e;border-radius:9px;padding:10px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid.one{grid-template-columns:1fr}.card{min-width:0;background:#121d30;border:1px solid #2a3951;border-radius:14px;overflow:hidden}.head{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{margin:0;font-size:18px}.head small{color:#9db0c9}pre code.hljs{background:transparent;padding:0}pre{margin:0;padding:20px;overflow:auto;min-height:280px;background:#0c1423;line-height:1.6;tab-size:2}#custom{display:none;width:100%;height:180px;margin-bottom:20px;font:14px monospace}footer{text-align:center;padding:28px;color:#aabbd5}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script></head><body><header><h1>Awesome Coding Fonts</h1><p>10 free monospaced Nerd Fonts. Compare real code side by side.</p><a href="https://github.com/jellydn/awesome-coding-fonts">GitHub repository ↗</a></header><main><div class="controls"><label>Language <select id="lang"></select></label><label>Font size <input id="size" type="range" min="12" max="26" value="15"><output id="sizeLabel">15px</output></label><label>Highlight <input id="highlight" type="checkbox" checked></label><button id="columns">2 columns</button><button id="edit">Edit snippet</button></div><textarea id="custom" spellcheck="false"></textarea><div class="grid" id="grid"></div></main><footer>Open-source fonts from <a href="https://www.nerdfonts.com/font-downloads">Nerd Fonts</a>. No tracking.</footer><script>
const fonts=[['JetBrains Mono','JetBrainsMono','JetBrainsMonoNerdFontMono-Regular.ttf'],['Iosevka Term','IosevkaTerm','IosevkaTermNerdFontMono-Regular.ttf'],['Maple Mono','MapleMono','MapleMono-NF-CN-Regular.ttf'],['Fira Code','FiraCode','FiraCodeNerdFontMono-Regular.ttf'],['Geist Mono','GeistMono','GeistMonoNerdFontMono-Regular.otf'],['Cascadia Code','CascadiaCode','CaskaydiaCoveNerdFontMono-Regular.ttf'],['Monaspace Neon','Monaspace','MonaspaceNeonNerdFontMono-Regular.otf'],['Hack','Hack','HackNerdFontMono-Regular.ttf'],['Commit Mono','CommitMono','CommitMonoNerdFontMono-Regular.otf'],['0xProto','0xProto','0xProtoNerdFontMono-Regular.ttf']];
const snippets={
'TypeScript':"type Trade = { id: string; price: number; quantity: number };\nconst notional = (t: Trade) => t.price * t.quantity;\nconst trades: Trade[] = [{ id: 'ACX-001', price: 42.5, quantity: 8 }];\nconsole.log(trades.map(notional)); // => [340]",
'React / TSX':"import { useMemo, useState } from 'react';\nexport function Search({ trades }: { trades: Trade[] }) {\n  const [query, setQuery] = useState('');\n  const results = useMemo(() => trades.filter(t => t.id.includes(query)), [trades, query]);\n  return <input value={query} onChange={e => setQuery(e.target.value)} />;\n}",
'Node.js':"import { createServer } from 'node:http';\ncreateServer((req, res) => {\n  res.setHeader('content-type', 'application/json');\n  res.end(JSON.stringify({ ok: true, uptime: process.uptime() }));\n}).listen(3000);",
'Go':"package main\nimport (\"encoding/json\"; \"net/http\")\nfunc main() {\n  http.HandleFunc(\"/health\", func(w http.ResponseWriter, r *http.Request) {\n    json.NewEncoder(w).Encode(map[string]bool{\"ok\": true})\n  })\n  http.ListenAndServe(\":8080\", nil)\n}",
'Python':"from dataclasses import dataclass\nfrom decimal import Decimal\n@dataclass(frozen=True)\nclass Trade:\n    price: Decimal\n    quantity: int\ndef notional(t: Trade) -> Decimal:\n    return t.price * t.quantity\nprint(notional(Trade(Decimal('42.50'), 8)))",
'Rust':"#[derive(Debug)]\nstruct Trade { price: f64, quantity: u32 }\nimpl Trade {\n    fn notional(&self) -> f64 { self.price * self.quantity as f64 }\n}\nfn main() {\n    println!(\"{:.2}\", Trade { price: 42.5, quantity: 8 }.notional());\n}",
'SQL':"SELECT symbol, COUNT(*) AS trades,\n       ROUND(SUM(price * quantity), 2) AS notional\nFROM trades\nWHERE created_at >= NOW() - INTERVAL '7 days'\nGROUP BY symbol\nORDER BY notional DESC;",
'Bash':"#!/usr/bin/env bash\nset -euo pipefail\nfor service in api indexer worker; do\n  echo \"Deploying ${service}...\"\n  docker build -t \"acx/${service}:latest\" \"./services/${service}\"\ndone",
'JSON':'{\n  "name": "awesome-coding-fonts",\n  "scripts": { "dev": "vite", "test": "vitest" },\n  "editor": { "fontLigatures": true, "tabSize": 2 }\n}',
'YAML':"name: CI\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n      - run: npm ci && npm test"
};
// Only fetch verified Nerd Fonts paths; remaining fonts use locally installed versions.
const localFonts=fonts.map((_,i)=>'assets/fonts/'+i+'.woff2');
const grid=document.querySelector('#grid'),lang=document.querySelector('#lang'),size=document.querySelector('#size'),custom=document.querySelector('#custom');Object.keys(snippets).forEach(s=>lang.add(new Option(s,s)));
fonts.forEach(([name,dir,file],i)=>{const family='nf'+i;const style=document.createElement('style');style.textContent="@font-face{font-family:'"+family+"';src:url('"+localFonts[i]+"') format('woff2');font-display:swap}";document.head.append(style);const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='head';const title=document.createElement('div');const h=document.createElement('h2');h.textContent=(i+1)+'. '+name;const small=document.createElement('small');small.textContent='Self-hosted Nerd Font Mono'+' · 0 O 1 l I · != => ===';title.append(h,small);const a=document.createElement('a');a.href='https://www.nerdfonts.com/font-downloads';a.textContent='Download ↗';head.append(title,a);const pre=document.createElement('pre');pre.style.fontFamily="'"+family+"',monospace";pre.append(document.createElement('code'));card.append(head,pre);grid.append(card)});
function render(){const code=custom.style.display==='block'?custom.value:snippets[lang.value];document.querySelectorAll('pre').forEach(p=>{p.style.fontSize=size.value+'px';p.firstChild.textContent=code;if(document.querySelector('#highlight').checked && window.hljs){const languages={'TypeScript':'typescript','React / TSX':'typescript','Node.js':'javascript','Go':'go','Python':'python','Rust':'rust','SQL':'sql','Bash':'bash','JSON':'json','YAML':'yaml'};try{p.firstChild.innerHTML=hljs.highlight(code,{language:languages[lang.value],ignoreIllegals:true}).value}catch(e){p.firstChild.textContent=code}}});document.querySelector('#sizeLabel').textContent=size.value+'px'}
lang.onchange=()=>{custom.value=snippets[lang.value];render()};size.oninput=render;document.querySelector('#columns').onclick=e=>{grid.classList.toggle('one');e.target.textContent=grid.classList.contains('one')?'1 column':'2 columns'};document.querySelector('#edit').onclick=e=>{const editing=custom.style.display!=='block';custom.style.display=editing?'block':'none';if(editing)custom.value=snippets[lang.value];e.target.textContent=editing?'Use presets':'Edit snippet';render()};custom.oninput=render;document.querySelector('#highlight').onchange=render;window.addEventListener('load',render);render();
</script></body></html>
