name: Vendor Nerd Fonts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install 'fonttools[woff]>=4.50,<5'
      - run: python scripts/vendor_fonts.py
      - name: Commit local font assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/
          git diff --cached --quiet || (git commit -m "build: vendor 10 Nerd Fonts as local WOFF2" && git push)
